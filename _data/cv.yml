cv:
  name: Adriana Garcés García
  label: Abogada
  location: Lima, Perú
  summary: >-
    Abogada en derecho de la competencia, protección al consumidor, protección de datos personales y regulación.
    Curso la Diplomatura de especialización Ciencia de Datos para las Ciencias Sociales y la Gestión Pública de la PUCP.

  sections:
    - titulo: Experiencia profesional
      tipo: experiencia
      entradas:
        - company: Hernández & Cía Abogados
          position: Asociada, Área de Competencia y Consumidor
          location: Lima, Perú
          start_date: 2025
          end_date: actual
          summary: Setiembre de 2025 a la actualidad
          highlights:
            - Asesoría a empresas de los sectores salud, seguros y educación en la evaluación de normas para denunciar barreras burocráticas ilegales o carentes de razonabilidad.
            - Análisis de impacto regulatorio del nuevo Reglamento de Protección de Datos Personales.
            - Liderazgo en la presentación de operaciones para su autorización en control de concentraciones.
            - Liderazgo en la implementación de programas de cumplimiento en competencia, protección al consumidor y protección de datos personales.
            - Asesoría a empresas en procedimientos sancionadores por infracciones a las normas de libre competencia, competencia desleal, consumidor y protección de datos.
            - Opiniones legales sobre prácticas comerciales de empresas de los sectores alimentos, banca, minería y retail, desde la perspectiva de competencia.

        - company: Bullard, Falla & Ezcurra Abogados
          position: Asociada, Área de Regulación y Competencia
          location: Lima, Perú
          start_date: 2020
          end_date: 2024
          summary: Agosto de 2020 a abril de 2024
          highlights:
            - Asesoría a organismos multilaterales en la evaluación de regímenes regulatorios nacionales y en propuestas de mejora regulatoria.
            - Análisis de impacto regulatorio de proyectos normativos en sectores como telecomunicaciones, energía e hidrocarburos.
            - Asesoría a empresas en procedimientos sancionadores por infracciones a las normas de libre competencia, competencia desleal, consumidor y regulación de servicios públicos.
            - Opiniones legales sobre acuerdos y prácticas comerciales desde la perspectiva de competencia y regulación.
            - Asesoría legal en la estructuración de operaciones comerciales desde la perspectiva de competencia y control de concentraciones.
            - Liderazgo en la organización del Competition Law Moot Court, evento académico realizado con la Universidad del Pacífico en 2022 y 2024.

